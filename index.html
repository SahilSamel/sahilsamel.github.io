<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sahil Samel | Reverse Engineer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" href="favicon.svg" />
  <style>
    :root {
      --bg: #fafafa;
      --text: #1a1a1a;
      --text-muted: #666;
      --border: #e8e8e8;
      --link: #000;
      --link-hover: #0056b3;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.7;
      color: var(--text);
      max-width: 680px;
      margin: 60px auto 100px;
      padding: 0 24px;
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      margin-bottom: 0.5rem;
      color: #000;
    }
    p.bio {
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      font-size: 1.1rem;
      line-height: 1.5;
    }
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2.5rem 0;
    }
    h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
      color: #000;
    }
    .post-item {
      margin-bottom: 2.5rem;
    }
    .post-link {
      text-decoration: none;
      color: #000;
      font-weight: 700;
      font-size: 1.25rem;
      line-height: 1.35;
      display: inline-block;
      margin-bottom: 0.4rem;
      transition: color 0.15s ease;
    }
    .post-link:hover {
      color: var(--link-hover);
      text-decoration: underline;
    }
    .post-desc {
      color: #4a4a4a;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }
    .date {
      color: #888;
      font-size: 0.88rem;
      font-weight: 500;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 2.5rem;
    }
    .profile-icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      padding: 6px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .profile-text h1 {
      margin-bottom: 0.15rem;
    }
    .profile-text .bio {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="profile-header">
    <img src="favicon.svg" alt="Sahil Samel" class="profile-icon" />
    <div class="profile-text">
      <h1>Sahil Samel</h1>
      <p class="bio">I like to reverse engineer everything.</p>
    </div>
  </div>
  
  <hr />

  <h2>Recent Teardowns</h2>
  <article class="post-item">
    <a class="post-link" href="blog/why-you-cant-build-your-saas-as-an-engineer/">Why you can't build your SaaS as an excellent engineer</a>
    <p class="post-desc">Understanding the MOAT of successful SaaS, Distribution v/s product and why this is no get rich quick scheme for an engineer.</p>
    <div class="date">November 2026 &bull; 6 min read</div>
  </article>
</body>
</html>
